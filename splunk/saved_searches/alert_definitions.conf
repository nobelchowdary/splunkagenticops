# Splunk saved searches / alert definitions for SentinelFlow demo
# Import these into your Splunk instance via Settings > Searches, Reports, and Alerts

[Brute Force Detection]
search = index=auth action=failure | stats count by src_ip, user | where count > 50
alert.severity = 4
alert.track = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now

[Successful Login After Brute Force]
search = index=auth action=failure | stats count as failures by src_ip, user | where failures > 50 | join src_ip, user [search index=auth action=success | stats latest(_time) as success_time by src_ip, user]
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now

[Unusual Outbound Data Transfer]
search = index=network direction=outbound | stats sum(bytes_out) as total_bytes by src_ip, dest_ip | where total_bytes > 10000000
alert.severity = 4
alert.track = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now

[Lateral Movement Detection]
search = index=auth action=success LogonType=3 | stats dc(dest) as unique_hosts by user, src_ip | where unique_hosts > 3
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now

[Suspicious Process Execution]
search = index=endpoint event_type=process_creation (process_name="powershell.exe" OR process_name="mimikatz.exe" OR process_name="psexec.exe") | stats count by host, user, process_name, command_line
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now

[DNS Exfiltration Detection]
search = index=dns query_type=TXT | stats count by src_ip, query | where count > 10
alert.severity = 3
alert.track = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
